<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$(prog_name)</title><link rel="stylesheet" href="css/_runtime.css"><link rel="stylesheet" href="css/_pages.css"><link rel="stylesheet" href="css/app.css"><script type="text/javascript" src="js/settings.js"></script><script type="text/javascript" src="js/_runtime.js" defer="defer"></script><script type="text/javascript" src="js/_pages.js" defer="defer"></script><script type="text/javascript" src="js/index.js" defer="defer"></script></head><body><div id="mainPage"><nav id="sidebar"><div class="nav-header"><span class="logo" id="menuLogo"><icon data-icon="MenuIcon"></icon><span data-i18n="menu.title">LSC-Labs</span> </span><button id="sidebarHide" data-icon="Arrows"></button></div><ul></ul><ul class="UAC"><li data-auth="1"><button data-on="Signout"><span data-i18n="menu.signout">out</span></button></li><li data-auth="0"><button data-on="Signin"><span data-i18n="menu.signin">in</span></button></li></ul></nav><div id="mainView"><div id="infoBar"><div><button type="button" id="sidebarShow" data-icon="Arrows" data-icon-attr="rotate=130deg; height=16px; width=16px"></button></div><div class="pull-right" id="statusInfo" style="display: none;"><div class="alert alert-warning" role="alert"><icon data-icon-attr="class=pull-left" data-icon="Alert"></icon><span data-i18n="main.conLost"></span></div></div></div><div id="mainContent"></div></div><div class="footer"><div id="footerInfo" class="text-muted"><a href="$(homePage)" target="_" title="online repository" data-element-type="expand">$(prog_name) V$(prog_ver) - $(prog_copy)</a> <span id="ticketLink"></span></div><div id="changePending" style="display:none"><a data-i18n="main.changePending"></a></div></div></div><div id="altPage" style="display:none"></div><div id="Dialogs"><dialog id="reviewDialog" class="modalDialog"><div class="dialogHeader"><button type="button" class="closeButton pull-right"
